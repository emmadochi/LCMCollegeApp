<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../landing_page/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — LCM Ministerial College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:        #7DC026;
            --green-mid:    #abcf47;
            --green-dark:   #2E7D32;
            --green-darker: #1b5e20;
            --orange:       #F5A623;
            --red:          #ef4444;
            --red-bg:       #fef2f2;
            --red-border:   #fecaca;
            --gray-50:  #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--gray-50);
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--gray-100);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-section img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: var(--green-dark);
        }

        .form-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .form-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .form-header p {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.5;
        }

        .form-alert {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 18px;
            border: 1px solid transparent;
            gap: 9px;
            align-items: flex-start;
        }
        .form-alert.show { display: flex; }
        .form-alert.error { background: var(--red-bg); color: #b91c1c; border-color: var(--red-border); }
        .form-alert.success { background: #f0fdf4; color: var(--green-dark); border-color: #bbf7d0; }
        .form-alert i { margin-top: 1px; flex-shrink: 0; }

        .field-group { margin-bottom: 20px; }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 7px;
        }
        .field-wrap { position: relative; }
        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 13px;
            pointer-events: none;
        }
        .field-input {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 40px;
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--gray-900);
            outline: none;
            transition: var(--transition);
        }
        .field-input:focus {
            background: #fff;
            border-color: var(--green);
            box-shadow: 0 0 0 3.5px rgba(125,192,38,0.13);
        }

        .pwd-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-400);
            font-size: 14px;
            padding: 4px;
            outline: none;
        }

        .pwd-strength { margin-top: 9px; display: none; }
        .pwd-bars { display: flex; gap: 4px; margin-bottom: 5px; }
        .pwd-bar {
            flex: 1; height: 3px;
            border-radius: 2px;
            background: var(--gray-200);
            transition: background 0.3s;
        }
        .pwd-strength-lbl {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--gray-400);
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 22px rgba(46,125,50,0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            letter-spacing: 0.2px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(46,125,50,0.38);
        }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--green-dark);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--green); }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="logo-section">
            <img src="../logo.png" alt="Logo">
            <div class="logo-title">LCM Ministerial College</div>
        </div>

        <div class="form-header">
            <h1>Create new password</h1>
            <p>Choose a secure, strong password to protect your student account.</p>
        </div>

        <div class="form-alert" id="formAlert">
            <i></i>
            <span id="formAlertText"></span>
        </div>

        <form id="resetForm">
            <div class="field-group">
                <label class="field-label" for="newPassword">New Password</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="newPassword" required placeholder="Min. 8 characters" class="field-input" oninput="onPwdInput(this.value)">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('newPassword', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="pwd-strength" id="pwdStrengthWidget">
                    <div class="pwd-bars">
                        <div class="pwd-bar" id="sBar1"></div>
                        <div class="pwd-bar" id="sBar2"></div>
                        <div class="pwd-bar" id="sBar3"></div>
                        <div class="pwd-bar" id="sBar4"></div>
                    </div>
                    <span class="pwd-strength-lbl" id="pwdStrengthLbl"></span>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="confirmPassword">Confirm New Password</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-shield-halved field-icon"></i>
                    <input type="password" id="confirmPassword" required placeholder="Repeat your new password" class="field-input">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('confirmPassword', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-label">Save Password</span>
            </button>
        </form>

        <a href="index.html" class="back-link" style="display:none;" id="loginRedirect">
            <i class="fa-solid fa-right-to-bracket" style="margin-right:5px;"></i>Go to Sign In
        </a>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const alertBox = document.getElementById('formAlert');
        const alertText = document.getElementById('formAlertText');
        const submitBtn = document.getElementById('submitBtn');
        const loginRedirect = document.getElementById('loginRedirect');

        // Extract token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alertBox.className = 'form-alert error show';
            alertBox.style.display = 'flex';
            alertBox.querySelector('i').className = 'fa-solid fa-circle-xmark';
            alertText.textContent = 'Invalid or missing password reset token. Please request a new link.';
            form.style.display = 'none';
            loginRedirect.style.display = 'block';
        }

        function togglePwd(inputId, btn) {
            const el = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (el.type === 'password') {
                el.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                el.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        const STRENGTH_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
        const STRENGTH_LABELS = ['Too weak', 'Weak', 'Good', 'Strong'];

        function onPwdInput(val) {
            const widget = document.getElementById('pwdStrengthWidget');
            const bars = ['sBar1','sBar2','sBar3','sBar4'].map(id => document.getElementById(id));
            const lbl = document.getElementById('pwdStrengthLbl');

            if (!val) { widget.style.display = 'none'; return; }
            widget.style.display = 'block';

            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            bars.forEach((bar, i) => {
                bar.style.background = (i < score) ? STRENGTH_COLORS[score - 1] : '#e5e7eb';
            });
            lbl.textContent = STRENGTH_LABELS[score - 1] || '';
            lbl.style.color = STRENGTH_COLORS[score - 1] || '#9ca3af';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.className = 'form-alert';
            alertBox.style.display = 'none';

            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alertBox.className = 'form-alert error show';
                alertBox.style.display = 'flex';
                alertBox.querySelector('i').className = 'fa-solid fa-circle-xmark';
                alertText.textContent = 'Passwords do not match.';
                return;
            }

            if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                alertBox.className = 'form-alert error show';
                alertBox.style.display = 'flex';
                alertBox.querySelector('i').className = 'fa-solid fa-circle-xmark';
                alertText.textContent = 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, and one number.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.querySelector('.btn-label').textContent = 'Saving...';

            try {
                const response = await fetch('../api/auth/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'form-alert success show';
                    alertBox.style.display = 'flex';
                    alertBox.querySelector('i').className = 'fa-solid fa-circle-check';
                    alertText.textContent = data.message || 'Password updated successfully!';
                    form.style.display = 'none';
                    loginRedirect.style.display = 'block';
                } else {
                    alertBox.className = 'form-alert error show';
                    alertBox.style.display = 'flex';
                    alertBox.querySelector('i').className = 'fa-solid fa-circle-xmark';
                    alertText.textContent = data.message || 'Failed to reset password. Link may have expired.';
                }
            } catch (err) {
                console.error(err);
                alertBox.className = 'form-alert error show';
                alertBox.style.display = 'flex';
                alertBox.querySelector('i').className = 'fa-solid fa-circle-xmark';
                alertText.textContent = 'Connection error. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('.btn-label').textContent = 'Save Password';
            }
        });
    </script>
</body>
</html>
